<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Content-Security-Policy: scripts only from this site, data only to our Supabase project. If an XSS bug ever
         slips in, it can't load outside code or send data elsewhere. connect-src must match config.js (a unit test
         checks it). Styles allow 'unsafe-inline' because the UI sets colours in style attributes. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://evkzdabyyxbtchqtebfr.supabase.co wss://evkzdabyyxbtchqtebfr.supabase.co; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Save Point</title>
    <meta name="description" content="A shared game log for you and your friends." />
    <meta name="theme-color" content="#2A1418" />
    <meta name="color-scheme" content="dark" />

    <!-- Home-screen app settings -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Save Point" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />

    <link rel="preload" href="./fonts/funnel-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/funnel-display-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body style="background: #2a1418">
    <div id="app"></div>
    <div id="layer"></div>
    <noscript><p style="padding: 24px">Save Point needs JavaScript turned on.</p></noscript>

    <script src="./config.js"></script>
    <script src="./vendor/supabase.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
